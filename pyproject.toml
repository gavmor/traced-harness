[project]
name = "traced-agent"
version = "0.1.0"
description = "Whole-trace qualitative evaluation, failure taxonomy matrix labeling, and LLM-as-judge compiler"
readme = "README.md"
authors = [
    { name = "Gavin Morgan", email = "hello@gavmor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.8",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
]

[project.scripts]
traced-agent = "traced_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
