[project]
name = "traced-harness"
version = "0.1.0"
description = "A test bed harness for evaluating agentic peripherals (MCP, skills, etc.)"
readme = "README.md"
authors = [
    { name = "Gavin Morgan", email = "hello@gavmor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.1",
    "google-genai>=2.28.0",
    "httpx2>=2.13.0",
    "mcp>=1.2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "rich>=13.9.0",
]

[project.scripts]
traced-harness = "traced_harness.main:main"
traced-agent = "traced_harness.main:main"
traced-agno = "traced_harness.main:main"
traced-dspy = "traced_harness.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Collect only the project's own tests. Without this, bare `pytest` descends
# into the vendored skill directories (.agents/, skills/, .claude/, .crush/)
# and tries to collect their placeholder eval templates, which import
# deliberately-nonexistent modules (`ai_app`, `metrics`) and error on import.
testpaths = ["tests"]

