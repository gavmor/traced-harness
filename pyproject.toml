[project]
name = "traced-harness"
version = "0.1.0"
description = "A test bed harness for evaluating agentic peripherals (MCP, skills, etc.)"
readme = "README.md"
authors = [
    { name = "Gavin Morgan", email = "hello@gavmor.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.1",
    "google-genai>=2.28.0",
    "mcp>=1.2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic>=2.10.0",
    "python-frontmatter",
    "pyyaml>=6.0",
    "rich>=13.9.0",
]

[project.scripts]
traced-harness = "traced_harness.main:main"
traced-agent = "traced_harness.main:main"
traced-agno = "traced_harness.main:main"
traced-dspy = "traced_harness.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Collect only this project's tests. Without it, a checkout that has skills
# vendored locally (.agents/, skills/, .claude/, .crush/) makes bare `pytest`
# descend into their placeholder eval templates, which import deliberately
# nonexistent modules. CI and local then disagree.
testpaths = ["tests"]

[tool.ruff.lint]
# C901 is the complexity cap; the rest is ruff's default rule set.
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
# The bar for new code. Every function in the repo is under this except the
# grandfathered list below.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Pre-existing violations, grandfathered so the cap can be enforced now rather
# than after they are all fixed. This list is a burn-down — delete an entry
# when its file is clean, do not add to it.
#
#   client.py  parse_mcp_target  (16)  — no open PR addresses this
#   repl.py    run_repl          (24)  — fixed by #7 (-> 10)
#   skills.py  scan_skills_dirs  (13)  — fixed by #6 (-> 5)
#              load_skill_file   (13)  — fixed by #6 (-> 7)
#              discover_skills   (12)  — fixed by #6 (-> 4)
"src/traced_harness/client.py" = ["C901"]
"src/traced_harness/repl.py" = ["C901"]
"src/traced_harness/skills.py" = ["C901"]

